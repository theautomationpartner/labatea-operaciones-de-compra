      * {

      html,

        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      /* La cámara: lo único que se mueve en los zooms. */
      #camara {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      #grabacion {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #marca {
        position: absolute;
        right: 48px;
        bottom: 40px;
        width: 300px;
        height: 115px;
        transform-origin: 100% 100%;
      }
      #marca img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #negro {
        position: absolute;
        inset: 0;
        background: #000;
